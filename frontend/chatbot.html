
<!DOCTYPE html>
<html>
<head>
<title>Enterprise AI Assistant</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f7fb;
}

.sidebar{
width:240px;
height:100vh;
background:#1e293b;
color:white;
position:fixed;
padding:20px;
}

.sidebar h2{
margin-top:0;
}

.sidebar button{
width:100%;
margin-top:10px;
padding:10px;
border:none;
background:#334155;
color:white;
cursor:pointer;
border-radius:5px;
}

.main{
margin-left:240px;
padding:20px;
}

.chat-container{
max-width:900px;
margin:auto;
background:white;
height:80vh;
border-radius:10px;
display:flex;
flex-direction:column;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.chat-messages{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
margin-bottom:15px;
}

.user{
text-align:right;
}

.user .bubble{
background:#2563eb;
color:white;
}

.bot .bubble{
background:#e2e8f0;
}

.bubble{
display:inline-block;
padding:12px 16px;
border-radius:10px;
max-width:70%;
}

.chat-input{
display:flex;
border-top:1px solid #ddd;
}

.chat-input input{
flex:1;
padding:15px;
border:none;
outline:none;
font-size:15px;
}

.chat-input button{
padding:15px 25px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}

.chat-input button:hover{
background:#1d4ed8;
}

</style>
</head>


<body>

<div class="sidebar">
<h2>Enterprise AI</h2>

<button>Chatbot</button>
<button>Documents</button>
<button>Upload Docs</button>
<button>Settings</button>

</div>


<div class="main">

<h2>Enterprise Knowledge Assistant</h2>

<div class="chat-container">

<div class="chat-messages" id="chat"></div>

<div class="chat-input">
<input id="question" placeholder="Ask something..." />
<button onclick="sendMessage()">Send</button>
</div>

</div>

</div>


<script>

async function sendMessage(){

let input = document.getElementById("question")
let message = input.value.trim()

if(message === "") return

let chat = document.getElementById("chat")

chat.innerHTML += `
<div class="message user">
<div class="bubble">${message}</div>
</div>
`

input.value=""

chat.scrollTop = chat.scrollHeight


try{

let response = await fetch("http://127.0.0.1:8000/ask",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
question:message
})
})

let data = await response.json()

chat.innerHTML += `
<div class="message bot">
<div class="bubble">${data.answer}</div>
</div>
`

chat.scrollTop = chat.scrollHeight

}catch(e){

chat.innerHTML += `
<div class="message bot">
<div class="bubble">Error connecting to AI server</div>
</div>
`

}

}

</script>


</body>
</html>
