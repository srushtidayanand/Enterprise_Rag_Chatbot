<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Assistant</title>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-icon">🧠</span>
            <span class="logo-text">Enterprise AI</span>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-item active" data-view="chat" onclick="switchView('chat')">
                <span class="nav-icon">💬</span>
                <span class="nav-label">Chat</span>
            </button>
            <button class="nav-item" data-view="history" onclick="switchView('history')">
                <span class="nav-icon">🕐</span>
                <span class="nav-label">History</span>
            </button>
            <button class="nav-item" data-view="documents" onclick="switchView('documents')">
                <span class="nav-icon">📁</span>
                <span class="nav-label">Documents</span>
            </button>
            <button class="nav-item" data-view="metrics" onclick="switchView('metrics')">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Metrics</span>
            </button>
        </nav>

        <div class="sidebar-section-label">Quick Ask</div>
        <div class="quick-questions" id="quickQuestions">
            <!-- populated by JS based on role -->
        </div>

        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Loading…</span>
                    <span class="user-role-badge" id="userRoleBadge">–</span>
                </div>
                <button class="btn-logout" onclick="logout()" title="Sign out">⏻</button>
            </div>
        </div>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

        <!-- Top bar -->
        <div class="topbar">
            <div class="topbar-title" id="viewTitle">Chat</div>
            <div class="topbar-actions">
                <button class="topbar-btn" id="exportBtn" onclick="exportChat()" title="Export chat">⬇ Export</button>
                <button class="topbar-btn" id="clearBtn" onclick="clearChat()" title="Clear chat">🗑 Clear</button>
            </div>
        </div>

        <!-- ── CHAT VIEW ── -->
        <div class="view active" id="view-chat">
            <div class="messages" id="messages">
                <div class="welcome-msg">
                    <div class="welcome-icon">🧠</div>
                    <h3>How can I help you today?</h3>
                    <p>Ask me anything about your company policies. I'll only answer from your authorised documents.</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-row">
                    <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()" title="Voice input">🎤</button>
                    <textarea
                        id="userInput"
                        class="chat-input"
                        placeholder="Ask about company policies…"
                        rows="1"
                    ></textarea>
                    <button class="btn-send" onclick="sendMessage()">Send ➤</button>
                </div>
                <div class="input-hint">Enter to send · Shift+Enter for new line · 🎤 for voice</div>
            </div>
        </div>

        <!-- ── HISTORY VIEW ── -->
        <div class="view" id="view-history">
            <div class="view-content" id="historyContent">
                <div class="loading-state">Loading history…</div>
            </div>
        </div>

        <!-- ── DOCUMENTS VIEW ── -->
        <div class="view" id="view-documents">
            <div class="view-content" id="docsContent">
                <div class="loading-state">Loading documents…</div>
            </div>
        </div>

        <!-- ── METRICS VIEW ── -->
        <div class="view" id="view-metrics">
            <div class="view-content" id="metricsContent">
                <div class="loading-state">Loading metrics…</div>
            </div>
        </div>

    </main>
</div>

<!-- PDF Viewer Modal -->
<div id="pdfModal" class="pdf-modal" onclick="closePdfModal(event)">
    <div class="pdf-modal-box">
        <div class="pdf-modal-header">
            <span id="pdfModalTitle" class="pdf-modal-filename">Document Viewer</span>
            <div class="pdf-modal-controls">
                <button onclick="changePdfPage(-1)">◀ Prev</button>
                <span id="pdfPageInfo">Page 1</span>
                <button onclick="changePdfPage(1)">Next ▶</button>
                <button class="btn-close-modal" onclick="closePdfModal()">✕ Close</button>
            </div>
        </div>
        <div class="pdf-snippet-banner" id="pdfSnippetBanner"></div>
        <div class="pdf-modal-body">
            <div class="pdf-canvas-wrap">
                <canvas id="pdfCanvas"></canvas>
                <div id="pdfTextLayer" class="pdf-text-layer"></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
